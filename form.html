<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WDD 131 – Dynamic Web Fundamentals – Guadalupe Fernández León</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals. Guadalupe Ferndez Leon" />
    <meta name="author" content="Guadalupe Fernández León" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
    
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form id="reviewForm" method="get" action="review.html">

            
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    
                </select>
            </div>

            
            <div class="form-group">
                <label>Overall Rating</label>
                <div class="rating-container">
                    <div class="rating-option">
                        <span class="stars">☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">1</label>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <label for="rating2">2</label>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <label for="rating3">3</label>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <label for="rating4">4</label>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <label for="rating5">5</label>
                    </div>
                </div>
            </div>

            
            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            
            <div class="form-group">
                <label>Which features did you find useful in the product?<br>
                    <em>(Check all that apply)</em>
                </label>
                <div class="checkbox-group">
                    <div class="checkbox-option">
                        <input type="checkbox" id="featureDurability" name="features" value="Durability">
                        <label for="featureDurability">Durability</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="featureEaseOfUse" name="features" value="Ease of Use">
                        <label for="featureEaseOfUse">Ease of Use</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="featurePerformance" name="features" value="Performance">
                        <label for="featurePerformance">Performance</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="featureDesign" name="features" value="Design">
                        <label for="featureDesign">Design</label>
                    </div>
                </div>
            </div>

            
            <div class="form-group">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5" cols="40"></textarea>
            </div>

            
            <div class="form-group">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </div>

            
            <div class="form-group">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
           <p>&copy; <span id="currentyear"></span> Guadalupe Fernández Leon &mdash; Querétaro, México</p>
           <p id="lastModified"></p>    
    </footer>

    
</body>
</html>
